name: 'togi - Mutation Testing'
description: 'Diff-targeted mutation testing for pull requests'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  base:
    description: 'Base branch to diff against'
    required: false
  timeout:
    description: 'Per-mutation timeout in seconds'
    required: false
  test-cmd:
    description: 'Test command override'
    required: false
  format:
    description: 'Output format (terminal, json, github, html, or sarif)'
    required: false
  upload-report:
    description: 'Upload the replayable JSON report artifact'
    required: false
    default: 'true'
  report-retention-days:
    description: 'Retention in days for the replayable JSON report artifact'
    required: false
    default: '14'
  report-artifact-name:
    description: 'Name for the replayable JSON report artifact'
    required: false
    default: 'togi-report'
  version:
    description: 'Immutable released togi version to use'
    required: false
    default: 'v0.6.0'

outputs:
  report-path:
    description: 'Path to the generated replayable JSON report'
    value: ${{ steps.run-togi.outputs.report-path }}
  mutation-score:
    description: 'Mutation score from the replayable JSON report'
    value: ${{ steps.run-togi.outputs.mutation-score }}
  survivor-count:
    description: 'Survivor count from the replayable JSON report'
    value: ${{ steps.run-togi.outputs.survivor-count }}

runs:
  using: 'composite'
  steps:
    - name: Install togi
      shell: bash
      env:
        TOGI_VERSION_INPUT: ${{ inputs.version }}
      run: |
        set -euo pipefail
        VERSION="${TOGI_VERSION_INPUT:-v0.6.0}"
        if [[ ! "$VERSION" =~ ^v[0-9]+[.][0-9]+[.][0-9]+$ ]]; then
          echo "Togi version must be an immutable vX.Y.Z tag" >&2
          exit 1
        fi

        unset resolver_output TOGI_ARCHIVE TOGI_BINARY TOGI_ARCHIVE_PATH TOGI_OS TOGI_ARCH
        if ! resolver_output=$(bash "${{ github.action_path }}/.github/scripts/resolve-togi-asset.sh"); then
          echo "Could not resolve Togi release asset" >&2
          exit 1
        fi
        eval "$resolver_output"
        if [[ -z "${TOGI_ARCHIVE:-}" || -z "${TOGI_BINARY:-}" ]]; then
          echo "Togi release asset resolver returned incomplete metadata" >&2
          exit 1
        fi

        TEMP_ROOT="${RUNNER_TEMP:-.}"
        if command -v cygpath >/dev/null 2>&1; then
          TEMP_ROOT=$(cygpath -u "$TEMP_ROOT")
        fi
        mkdir -p "$TEMP_ROOT"
        unset fetch_output TOGI_ARCHIVE_PATH
        if ! fetch_output=$(
          TOGI_VERSION="$VERSION" TOGI_ARCHIVE="$TOGI_ARCHIVE" TOGI_FETCH_DIR="$TEMP_ROOT" \
            bash "${{ github.action_path }}/.github/scripts/fetch-togi-release-asset.sh"
        ); then
          echo "Could not fetch and verify Togi release asset" >&2
          exit 1
        fi
        eval "$fetch_output"
        if [[ -z "${TOGI_ARCHIVE_PATH:-}" ]]; then
          echo "Togi release asset fetch returned no archive path" >&2
          exit 1
        fi
        RUNNER_TEMP="$TEMP_ROOT" TOGI_ARCHIVE="$TOGI_ARCHIVE" TOGI_BINARY="$TOGI_BINARY" \
          TOGI_ARCHIVE_PATH="$TOGI_ARCHIVE_PATH" \
          bash "${{ github.action_path }}/.github/scripts/install-togi-archive.sh"

        TOGI_BIN="${TEMP_ROOT}/togi-bin/${TOGI_BINARY}"
        {
          printf 'TOGI_BIN=%s\n' "$TOGI_BIN"
          printf 'TOGI_EXPECTED_VERSION=%s\n' "$VERSION"
        } >> "$GITHUB_ENV"

    - name: Run togi
      id: run-togi
      shell: bash
      env:
        TOGI_BASE: ${{ inputs.base }}
        TOGI_TIMEOUT: ${{ inputs.timeout }}
        TOGI_FORMAT: ${{ inputs.format }}
        TOGI_TEST_CMD: ${{ inputs.test-cmd }}
        TOGI_REPORT_PATH: ${{ runner.temp }}/togi-report.json
      run: |
        bash "${{ github.action_path }}/.github/scripts/run-togi.sh"

    - name: Upload replayable report
      if: ${{ always() && inputs.upload-report == 'true' && steps.run-togi.outputs.report-path != '' }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
      with:
        name: ${{ inputs.report-artifact-name }}
        path: ${{ runner.temp }}/togi-report.json
        retention-days: ${{ inputs.report-retention-days }}
        if-no-files-found: warn
