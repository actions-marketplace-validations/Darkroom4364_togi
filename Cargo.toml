[package]
name = "togi"
version = "0.6.0"
edition = "2024"
rust-version = "1.87"
description = "Diff-targeted, multi-language mutation testing for pull requests"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Darkroom4364/togi"
readme = "README.md"
keywords = ["mutation-testing", "testing", "diff", "tree-sitter", "code-quality"]
categories = ["development-tools::testing", "command-line-utilities"]

[features]
# Narrowly exposes the libFuzzer execution harness; normal builds have no fuzz API.
fuzzing = []

[dependencies]
# CLI
clap = { version = "4", features = ["derive"] }

# Parsing
tree-sitter = "0.26"
tree-sitter-go = "0.25"
tree-sitter-python = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-typescript = "0.23.2"
tree-sitter-java = "0.23"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"

# Config
serde = { version = "1", features = ["derive"] }
toml = "1.1"

# Output
serde_json = "1"
sha2 = "0.11"
caseless = "0.2.2"

# Filesystem
tempfile = "3"
globset = "0.4"
ignore = "0.4"
cap-std = "4.0.2"
cap-tempfile = "4.0.2"
cap-fs-ext = "4.0.2"

# Shell parsing
shell-words = "1"

# Error handling
anyhow = "1"

# Signal handling
ctrlc = "3"

# Platform
[target.'cfg(unix)'.dependencies]
libc = "0.2"
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemInformation"] }

[profile.release]
lto = "thin"
strip = true

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
serde_yaml = "0.9.34"
