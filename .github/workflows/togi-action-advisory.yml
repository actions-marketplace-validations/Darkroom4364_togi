name: Togi Action Advisory

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: togi-action-advisory-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  mutation-test:
    name: Togi Action Advisory
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Fetch fixture dependencies
        run: cargo fetch --locked
      - name: Run Togi action (advisory)
        id: togi
        continue-on-error: true
        uses: Darkroom4364/togi@e692e2d169b7a717c6b911884e90c0bcd0d133b1 # v0.4.1 release action source
        with:
          version: v0.4.1
          base: origin/${{ github.base_ref }}
          test-cmd: cargo test --locked
          timeout: '120'
          format: json
          upload-report: 'true'
          report-artifact-name: togi-action-advisory-report
          report-retention-days: '14'
      - name: Record Togi report (advisory)
        if: ${{ always() }}
        env:
          TOGI_REPORT_PATH: ${{ steps.togi.outputs.report-path }}
          TOGI_MUTATION_SCORE: ${{ steps.togi.outputs.mutation-score }}
          TOGI_SURVIVOR_COUNT: ${{ steps.togi.outputs.survivor-count }}
        run: |
          printf 'report path: %s\n' "$TOGI_REPORT_PATH"
          printf 'mutation score: %s\n' "$TOGI_MUTATION_SCORE"
          printf 'survivor count: %s\n' "$TOGI_SURVIVOR_COUNT"
