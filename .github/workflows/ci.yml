name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  foxguard:
    name: Foxguard Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Foxguard
        uses: 0sec-labs/foxguard/action@0be2a55dde65d6d1b3741f921165e4e728420ac5
        with:
          path: .
          severity: high
          version: v0.9.0
          fail-on-findings: "true"
          upload-sarif: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}

  check:
    name: Build & Test ${{ matrix.target }} (Tier ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: x86_64
            tier: 1
          - target: aarch64-apple-darwin
            os: macos-15
            arch: arm64
            tier: 2
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x86_64
            tier: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: ${{ matrix.target }}
          TOGI_EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.87
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Test
        run: cargo test --locked

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo-audit audit
      - name: Enforce pinned external actions
        run: ./.github/scripts/check-pinned-actions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt -- --check

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test extension
        working-directory: editors/vscode
        run: node --test test/*.test.js

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Integration tests
        run: cargo test --locked -- --ignored

  dogfood:
    name: Dogfood (togi on togi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Build togi
        run: cargo build --locked --release
      - name: Run blocking dogfood smoke test
        run: ./.github/scripts/run-dogfood-smoke.sh

  pr-loop-benchmarks:
    name: PR-loop Benchmark Evidence
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.5'
      - name: Create job-private Go build cache
        shell: bash
        env:
          BENCH_GOCACHE: ${{ runner.temp }}/togi-pr-loop-gocache
        run: |
          set -euo pipefail
          if [ -e "$BENCH_GOCACHE" ] && [ -n "$(ls -A "$BENCH_GOCACHE" 2>/dev/null)" ]; then
            echo "job-private Go build cache $BENCH_GOCACHE must start empty" >&2
            exit 1
          fi
          mkdir -p "$BENCH_GOCACHE"
          test -d "$BENCH_GOCACHE"
          test -z "$(ls -A "$BENCH_GOCACHE")"
      - name: Check benchmark prerequisites
        shell: bash
        run: |
          set -euo pipefail
          packages=()
          for tool in bash git go jq sed sha256sum python3; do
            if ! command -v "$tool" >/dev/null 2>&1; then
              case "$tool" in
                bash) packages+=(bash) ;;
                git) packages+=(git) ;;
                go) packages+=(golang-go) ;;
                jq) packages+=(jq) ;;
                sed) packages+=(sed) ;;
                sha256sum) packages+=(coreutils) ;;
                python3) packages+=(python3) ;;
              esac
            fi
          done
          if ((${#packages[@]})); then
            sudo apt-get update
            sudo apt-get install --yes --no-install-recommends "${packages[@]}"
          fi
          for tool in bash git go jq sed sha256sum python3; do
            command -v "$tool" >/dev/null 2>&1 || {
              echo "missing benchmark prerequisite: $tool" >&2
              exit 1
            }
          done
      - name: Build release binary
        run: cargo build --locked --release
      - name: Warm Go build cache for PR-loop benchmark evidence
        shell: bash
        env:
          TOGI_BIN: ${{ github.workspace }}/target/release/togi
          BENCH_RUNNER_LABEL: github-actions-ubuntu-24.04-linux-x86_64
          BENCH_GO_BUILD_CACHE_STATE: warmup
          GOCACHE: ${{ runner.temp }}/togi-pr-loop-gocache
          BENCHMARK_OUTPUT: ${{ runner.temp }}/togi-pr-loop-benchmarks/warmup
        run: bash benchmarks/pr-loop/run-pr-loop-benchmarks.sh --output "$BENCHMARK_OUTPUT"
      - name: Run PR-loop benchmark harness
        shell: bash
        env:
          TOGI_BIN: ${{ github.workspace }}/target/release/togi
          BENCH_RUNNER_LABEL: github-actions-ubuntu-24.04-linux-x86_64
          BENCH_GO_BUILD_CACHE_STATE: primed
          GOCACHE: ${{ runner.temp }}/togi-pr-loop-gocache
          BENCHMARK_OUTPUT: ${{ runner.temp }}/togi-pr-loop-benchmarks/measured
        run: bash benchmarks/pr-loop/run-pr-loop-benchmarks.sh --output "$BENCHMARK_OUTPUT"
      - name: Validate PR-loop benchmark evidence
        shell: bash
        env:
          BENCHMARK_OUTPUT: ${{ runner.temp }}/togi-pr-loop-benchmarks/measured
        run: |
          set -euo pipefail
          result="$BENCHMARK_OUTPUT/pr-loop-benchmark-result.json"
          raw="$BENCHMARK_OUTPUT/raw"
          test -f "$result"
          test -d "$raw"
          jq -e '
            .ok == true
            and ([.workloads[].name]
                 == ["cold-regular", "warm-exact-cache", "cold-schemata", "pr-diff-default",
                     "multi-file-regular", "multi-file-default"])
          ' "$result" >/dev/null
          for workload in cold-regular warm-exact-cache cold-schemata pr-diff-default multi-file-regular multi-file-default; do
            for suffix in report.json stdout stderr; do
              test -f "$raw/$workload.$suffix"
            done
          done
      - name: Upload PR-loop benchmark evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: pr-loop-benchmarks-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/togi-pr-loop-benchmarks
          if-no-files-found: warn
