name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  foxguard:
    name: Foxguard Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Run Foxguard
        uses: 0sec-labs/foxguard/action@1fbe7f384d6dda358f2dc7f712dddf25b8e4be76
        with:
          path: .
          severity: high
          version: v0.9.0
          fail-on-findings: "true"
          upload-sarif: "true"

  check:
    name: Build & Test ${{ matrix.target }} (Tier ${{ matrix.tier }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: x86_64
            tier: 1
          - target: aarch64-apple-darwin
            os: macos-15
            arch: arm64
            tier: 2
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x86_64
            tier: 2
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: ${{ matrix.target }}
          TOGI_EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked

  msrv:
    name: MSRV
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: 1.87
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Test
        run: cargo test --locked

  supply-chain:
    name: Supply Chain
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: Audit Rust dependencies
        run: cargo-audit audit
      - name: Enforce pinned external actions
        run: ./.github/scripts/check-pinned-actions.sh

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Clippy
        run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - name: Format
        run: cargo fmt -- --check

  vscode:
    name: VS Code Extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - name: Test extension
        working-directory: editors/vscode
        run: node --test test/*.test.js

  integration:
    name: Integration Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: actions/setup-node@v7
        with:
          node-version: 24.14.1
          package-manager-cache: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Integration tests
        run: cargo test --locked -- --ignored

  dogfood:
    name: Dogfood (togi on togi)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: x86_64-unknown-linux-gnu
          TOGI_EXPECTED_ARCH: x86_64
        run: bash ./.github/scripts/assert-native-target.sh
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16
        with:
          cache-bin: false
      - name: Build togi
        run: cargo build --locked --release
      - name: Run blocking dogfood smoke test
        run: ./.github/scripts/run-dogfood-smoke.sh

  build:
    name: Build ${{ matrix.target }} (Tier ${{ matrix.tier }}, release)
    needs: [foxguard, check, msrv, supply-chain, lint, vscode, integration, dogfood]
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
            arch: x86_64
            tier: 1
            name: togi-linux-x86_64
          - target: aarch64-apple-darwin
            os: macos-15
            arch: arm64
            tier: 2
            name: togi-macos-arm64
          - target: x86_64-pc-windows-msvc
            os: windows-2022
            arch: x86_64
            tier: 2
            name: togi-windows-x86_64
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Assert runner matches the required target
        shell: bash
        env:
          TOGI_EXPECTED_TARGET: ${{ matrix.target }}
          TOGI_EXPECTED_ARCH: ${{ matrix.arch }}
        run: bash ./.github/scripts/assert-native-target.sh
      - name: Build
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../${{ matrix.name }}.tar.gz togi
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path target/${{ matrix.target }}/release/togi.exe -DestinationPath ${{ matrix.name }}.zip
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ matrix.name }}
          path: |
            ${{ matrix.name }}.tar.gz
            ${{ matrix.name }}.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Generate checksums
        run: sha256sum ./*.tar.gz ./*.zip > checksums.txt
      - name: Attest release artifacts
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            *.tar.gz
            *.zip
            checksums.txt
      - name: Create Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228
        with:
          files: |
            *.tar.gz
            *.zip
            checksums.txt
          generate_release_notes: true

  verify-release-identity:
    name: Verify Release Identity
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TOGI_VERSION: ${{ github.ref_name }}
      TOGI_WORKFLOW_HEAD: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Verify tag commit, workflow head, and release association
        run: bash ./.github/scripts/verify-release-identity.sh

  verify-release:
    name: Verify Published Release (${{ matrix.asset }})
    needs: release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - asset: linux-x86_64
            os: ubuntu-24.04
            arch: x86_64
            archive: togi-linux-x86_64.tar.gz
            binary: togi
            tier: 1
          - asset: macos-arm64
            os: macos-15
            arch: arm64
            archive: togi-macos-arm64.tar.gz
            binary: togi
            tier: 2
          - asset: windows-x86_64
            os: windows-2022
            arch: x86_64
            archive: togi-windows-x86_64.zip
            binary: togi.exe
            tier: 2
    env:
      TOGI_VERSION: ${{ github.ref_name }}
      TOGI_EXPECTED_ARCH: ${{ matrix.arch }}
      TOGI_EXPECTED_ARCHIVE: ${{ matrix.archive }}
      TOGI_EXPECTED_BINARY: ${{ matrix.binary }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        if: ${{ matrix.tier == 1 }}
        with:
          go-version: stable
          cache: false
      - name: Tier 1 released-binary mutation smoke
        if: ${{ matrix.tier == 1 }}
        shell: bash
        run: bash ./.github/scripts/run-released-binary-smoke.sh
      - name: Tier 2 released-archive install smoke
        if: ${{ matrix.tier == 2 }}
        shell: bash
        run: bash ./.github/scripts/run-released-binary-install-smoke.sh
